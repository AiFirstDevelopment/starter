# The quorum enforcement layer checks the rest of the pipeline. This checks it.
#
# guard.py, the plan-lock hook, and the state recorder are what the pipeline's
# promises now rest on. If one of them silently stops firing, every downstream
# report becomes confidently wrong — so they get a test suite, and it runs here.
name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Enforcement layer self-test
        run: python3 plugins/quorum/bin/selftest.py -v
